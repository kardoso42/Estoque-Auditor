<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Estoque V51 — Omie</title><link rel="stylesheet" href="../frontend/css/app.css"></head><body><header class="topbar"><div><strong>Smart Estoque</strong><span class="version">V51 • OMIE • DEV</span></div></header><main class="app-shell"><section class="hero-card"><div><span class="eyebrow">BACK-OFFICE</span><h1>Importação Omie</h1><p>Pré-visualização e filtros antes de gravar o catálogo V51.</p></div><span class="status">TESTE</span></section><section class="search-card"><label for="arquivo">Arquivo Omie</label><input id="arquivo" type="file" accept=".xlsx,.xls"><p id="info" style="font-size:11px;color:#64748b">Selecione uma planilha.</p><div class="actions"><button id="ler" class="primary" type="button" disabled>🔎 Ler planilha</button><button id="enviar" type="button" disabled>🚀 Enviar selecionados</button></div></section><section class="info-grid"><article><span>Linhas lidas</span><strong id="lidas">0</strong></article><article><span>Selecionadas</span><strong id="selecionadas">0</strong></article></section><section class="search-card"><label>Filtros</label><div id="filtros" style="display:grid;gap:8px"></div><div id="resumo" style="margin-top:10px;font-size:11px;color:#64748b">Aguardando leitura.</div></section></main><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script type="module">import{lerOmie,prepararOmie,exportarCatalogoLocal}from'../frontend/js/omie-import.js';let dados=null,resultado=null;const a=document.getElementById('arquivo'),ler=document.getElementById('ler'),enviar=document.getElementById('enviar');a.onchange=()=>{const f=a.files?.[0];document.getElementById('info').textContent=f?f.name:'Selecione uma planilha.';ler.disabled=!f};ler.onclick=async()=>{try{dados=await lerOmie(a.files[0]);resultado=prepararOmie(dados.rows);document.getElementById('lidas').textContent=resultado.totalLido.toLocaleString('pt-BR');document.getElementById('selecionadas').textContent=resultado.totalSelecionado.toLocaleString('pt-BR');enviar.disabled=!resultado.produtos.length;renderFiltros(resultado)}catch(e){document.getElementById('resumo').textContent='Erro: '+e.message}};function renderFiltros(r){const box=document.getElementById('filtros');box.replaceChildren();[['local',r.locais],['familia',r.familias]].forEach(([tipo,lista])=>{if(!lista.length)return;const label=document.createElement('label');label.innerHTML=`<b>${tipo==='local'?'Locais':'Famílias'}</b>`;const select=document.createElement('select');select.multiple=true;select.size=Math.min(6,lista.length);select.style.cssText='width:100%;padding:8px;border:1px solid #d8dee8;border-radius:10px';lista.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;select.appendChild(o)});select.onchange=()=>atualizar();label.appendChild(select);box.appendChild(label)});const p=document.createElement('label');p.innerHTML='<input id="pendentes" type="checkbox"> Somente pendentes';p.onchange=()=>atualizar();box.appendChild(p)}function atualizar(){const selects=[...document.querySelectorAll('#filtros select')];resultado=prepararOmie(dados.rows,{locais:[...(selects[0]?.selectedOptions||[])].map(o=>o.value),familias:[...(selects[1]?.selectedOptions||[])].map(o=>o.value),pendentes:document.getElementById('pendentes')?.checked});document.getElementById('selecionadas').textContent=resultado.totalSelecionado.toLocaleString('pt-BR');enviar.disabled=!resultado.produtos.length}enviar.onclick=()=>{if(!resultado)return;const n=exportarCatalogoLocal(resultado.produtos);document.getElementById('resumo').textContent=`${n.toLocaleString('pt-BR')} produtos enviados para o catálogo de TESTE da V51.`};</script></body></html>
