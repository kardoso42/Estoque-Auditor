<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Estoque V51 — Mapeamento</title><link rel="stylesheet" href="../frontend/css/app.css"></head><body><header class="topbar"><div><strong>Smart Estoque</strong><span class="version">V51 • IMPORTADOR UNIVERSAL</span></div></header><main class="app-shell"><section class="hero-card"><div><span class="eyebrow">IMPORTADOR UNIVERSAL</span><h1>Mapear colunas</h1><p>Confirme como o arquivo deve ser interpretado antes da importação.</p></div><span class="status">TESTE</span></section><section class="search-card"><label for="arquivo">Arquivo Excel / CSV</label><input id="arquivo" type="file" accept=".xlsx,.xls,.csv"><p id="info" style="font-size:11px;color:#64748b">Selecione um arquivo para começar.</p></section><section id="mapping" class="search-card" hidden><label>Mapeamento</label><div id="fields" style="display:grid;gap:8px;margin-top:10px"></div><div class="actions" style="margin-top:12px"><button id="preview" class="primary" type="button">🔎 Validar mapeamento</button><button id="save" type="button" disabled>📥 Importar</button></div><div id="summary" style="margin-top:12px;font-size:11px;color:#64748b"></div></section></main><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script type="module">import{detectarMapeamento,CAMPOS,prepararImportacao,salvarCatalogo}from'../frontend/js/catalogo.js';let rows=[],headers=[],mapping={};const file=document.getElementById('arquivo');file.onchange=async()=>{const f=file.files?.[0];if(!f)return;document.getElementById('info').textContent=f.name;const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),sheet=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(sheet,{defval:''});headers=rows.length?Object.keys(rows[0]):[];mapping=detectarMapeamento(headers);render();};function render(){const box=document.getElementById('fields');box.replaceChildren();CAMPOS.forEach(c=>{const label=document.createElement('label');label.style.cssText='display:grid;gap:5px;font-size:11px;font-weight:700';label.textContent=c.toUpperCase();const select=document.createElement('select');select.dataset.field=c;select.style.cssText='padding:10px;border:1px solid #d8dee8;border-radius:10px;background:#fff';const empty=document.createElement('option');empty.value='';empty.textContent='— não importar —';select.appendChild(empty);headers.forEach(h=>{const o=document.createElement('option');o.value=h;o.textContent=h;if(mapping[c]===h)o.selected=true;select.appendChild(o)});select.onchange=()=>mapping[c]=select.value;label.appendChild(select);box.appendChild(label)});document.getElementById('mapping').hidden=false;}document.getElementById('preview').onclick=()=>{const produtos=prepararImportacao(rows,mapping);document.getElementById('summary').textContent=`Mapeamento válido. ${produtos.length.toLocaleString('pt-BR')} registros de produto serão importados.`;document.getElementById('save').disabled=!produtos.length};document.getElementById('save').onclick=()=>{const produtos=prepararImportacao(rows,mapping),n=salvarCatalogo(produtos);document.getElementById('summary').textContent=`Importação concluída: ${n.toLocaleString('pt-BR')} registros no catálogo de TESTE V51.`};</script></body></html>
