<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Estoque V51 — Importador Universal</title><link rel="stylesheet" href="../frontend/css/app.css"><style>.preview{overflow:auto;margin-top:14px;border:1px solid #e3e8ef;border-radius:12px}.preview table{width:100%;border-collapse:collapse;font-size:10px;background:#fff}.preview th,.preview td{padding:9px;border-bottom:1px solid #edf0f4;text-align:left;white-space:nowrap}.preview th{font-size:9px;color:#64748b;background:#f8fafc}.ok{color:#166534}.warn{color:#92400e}.mapping-note{padding:10px;border-radius:10px;background:#f8fafc;color:#64748b;font-size:10px;margin-top:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.stat{padding:12px;border:1px solid #e3e8ef;border-radius:10px;background:#fff}.stat span{display:block;font-size:9px;color:#64748b}.stat strong{display:block;font-size:18px;margin-top:3px}</style></head><body><header class="topbar"><div><strong>Smart Estoque</strong><span class="version">V51 • IMPORTADOR UNIVERSAL</span></div></header><main class="app-shell"><section class="hero-card"><div><span class="eyebrow">IMPORTADOR UNIVERSAL</span><h1>Importar dados</h1><p>Escolha um arquivo, confirme o mapeamento e confira uma prévia antes de gravar.</p></div><span class="status">TESTE</span></section><section class="search-card"><label for="arquivo">Arquivo Excel / CSV</label><input id="arquivo" type="file" accept=".xlsx,.xls,.csv"><p id="info" style="font-size:11px;color:#64748b">Selecione um arquivo para começar.</p><div id="stats" class="stats" hidden></div></section><section id="mapping" class="search-card" hidden><label>Mapeamento das colunas</label><div class="mapping-note">A detecção é automática, mas você pode corrigir qualquer campo manualmente.</div><div id="fields" style="display:grid;gap:8px;margin-top:10px"></div><div class="actions" style="margin-top:12px"><button id="preview" class="primary" type="button">🔎 Gerar prévia</button><button id="save" type="button" disabled>📥 Importar dados</button></div><div id="summary" style="margin-top:12px;font-size:11px;color:#64748b"></div><div id="table" class="preview" hidden></div></section></main><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script type="module">import{detectarMapeamento,detectarLinhaCabecalho,CAMPOS,prepararImportacao,salvarCatalogo}from'../frontend/js/catalogo.js';let rows=[],headers=[],mapping={},produtos=[];const file=document.getElementById('arquivo');file.onchange=async()=>{const f=file.files?.[0];if(!f)return;document.getElementById('info').textContent=f.name;try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),sheet=wb.Sheets[wb.SheetNames[0]],matrix=XLSX.utils.sheet_to_json(sheet,{header:1,defval:''});const wrapped=matrix.map(r=>Object.fromEntries(r.map((v,j)=>[String(j),v]))),info=detectarLinhaCabecalho(wrapped);const headerRow=matrix[info.index]||[];headers=headerRow.map(String);rows=matrix.slice(info.index+1).filter(r=>r.some(v=>String(v??'').trim()!=='')).map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]??''])));mapping=detectarMapeamento(headers);showStats();render();}catch(e){document.getElementById('info').textContent='Erro ao ler arquivo: '+e.message}};function showStats(){const box=document.getElementById('stats');box.hidden=false;box.innerHTML=`<div class="stat"><span>LINHAS LIDAS</span><strong>${rows.length.toLocaleString('pt-BR')}</strong></div><div class="stat"><span>COLUNAS</span><strong>${headers.length}</strong></div><div class="stat"><span>CAMPOS DETECTADOS</span><strong>${CAMPOS.filter(c=>mapping[c]).length}/${CAMPOS.length}</strong></div>`}function render(){const box=document.getElementById('fields');box.replaceChildren();CAMPOS.forEach(c=>{const label=document.createElement('label');label.style.cssText='display:grid;gap:5px;font-size:11px;font-weight:700';label.textContent=c.toUpperCase();const select=document.createElement('select');select.dataset.field=c;select.style.cssText='padding:10px;border:1px solid #d8dee8;border-radius:10px;background:#fff';const empty=document.createElement('option');empty.value='';empty.textContent='— não importar —';select.appendChild(empty);headers.forEach(h=>{const o=document.createElement('option');o.value=h;o.textContent=h;if(mapping[c]===h)o.selected=true;select.appendChild(o)});select.onchange=()=>mapping[c]=select.value;label.appendChild(select);box.appendChild(label)});document.getElementById('mapping').hidden=false;}document.getElementById('preview').onclick=()=>{mapping={...mapping,...Object.fromEntries([...document.querySelectorAll('#fields select')].map(s=>[s.dataset.field,s.value]))};produtos=prepararImportacao(rows,mapping);document.getElementById('summary').innerHTML=`<span class="ok">✓ ${produtos.length.toLocaleString('pt-BR')} registros prontos para importação.</span> ${rows.length.toLocaleString('pt-BR')} linhas foram lidas.`;renderPreview();document.getElementById('save').disabled=!produtos.length};function renderPreview(){const table=document.getElementById('table');table.hidden=false;table.replaceChildren();const cols=['codigo','sku','gtin','nome','familia','local','quantidade','unidade','custo'];const t=document.createElement('table');const head=document.createElement('thead');head.innerHTML='<tr>'+cols.map(c=>`<th>${c.toUpperCase()}</th>`).join('')+'</tr>';t.appendChild(head);const body=document.createElement('tbody');produtos.slice(0,20).forEach(p=>{const tr=document.createElement('tr');tr.innerHTML=cols.map(c=>`<td>${escapeHtml(p[c])}</td>`).join('');body.appendChild(tr)});t.appendChild(body);table.appendChild(t);const note=document.createElement('div');note.style.cssText='padding:9px;font-size:10px;color:#64748b';note.textContent=`Exibindo até 20 registros de ${produtos.length.toLocaleString('pt-BR')}. Nenhum dado foi gravado ainda.`;table.appendChild(note)}document.getElementById('save').onclick=()=>{produtos=prepararImportacao(rows,mapping);const n=salvarCatalogo(produtos);document.getElementById('summary').innerHTML=`<span class="ok">✓ Importação concluída: ${n.toLocaleString('pt-BR')} registros no catálogo de TESTE V51.</span>`};function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}</script></body></html>
