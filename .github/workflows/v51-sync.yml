name: V51 Sync Catalogo

on:
  push:
    branches:
      - v51-sync-catalogo

permissions:
  contents: write

jobs:
  patch-sync:
    if: ${{ !contains(github.event.head_commit.message, 'V51: sincronizacao em tempo real') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar sincronizacao em tempo real
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'SMART_V51_CATALOGO_REALTIME' in s:
              print('Patch V51 ja aplicado.')
              raise SystemExit(0)

          marker = '        /* SMART_V51_CATALOGO_REALTIME */\n'
          s = s.replace('        let currentUser = null;\n', '        let currentUser = null;\n        let unsubscribeCatalogo = null;\n', 1)

          old_auth = """            if (currentUser) {\n                const colRefContagens = collection(db, 'artifacts', appId, 'public', 'data', 'contagens');\n                onSnapshot(colRefContagens, (snapshot) => {\n                    const newContagens = [];\n                    snapshot.forEach(docSnap => newContagens.push({ id: docSnap.id, ...docSnap.data() }));\n                    contagens = newContagens.sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));\n                    if (operadorAtual) window.render();\n                });\n            }\n"""
          new_auth = """            if (currentUser) {\n                const colRefContagens = collection(db, 'artifacts', appId, 'public', 'data', 'contagens');\n                onSnapshot(colRefContagens, (snapshot) => {\n                    const newContagens = [];\n                    snapshot.forEach(docSnap => newContagens.push({ id: docSnap.id, ...docSnap.data() }));\n                    contagens = newContagens.sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));\n                    if (operadorAtual) window.render();\n                });\n\n                // SMART_V51_CATALOGO_REALTIME\n                if (unsubscribeCatalogo) unsubscribeCatalogo();\n                const colRefCatalogoRealtime = collection(db, 'artifacts', appId, 'public', 'data', 'catalogo');\n                unsubscribeCatalogo = onSnapshot(colRefCatalogoRealtime, (snapshot) => {\n                    const novoCatalogo = [];\n                    snapshot.forEach(docSnap => novoCatalogo.push({ id: docSnap.id, ...docSnap.data() }));\n                    const anterior = baseDados.length;\n                    baseDados = novoCatalogo;\n                    try { localStorage.setItem('catalogo_local_enc', CryptoJS.AES.encrypt(JSON.stringify(baseDados), _HASH_V).toString()); } catch(e) {}\n                    window.atualizarFiltrosDOM();\n                    if (operadorAtual) window.render();\n                    if (anterior !== baseDados.length) {\n                        const statusMain = document.getElementById('status-catalog-main');\n                        if (statusMain) statusMain.innerText = `🔄 Catálogo atualizado em tempo real: ${baseDados.length} produtos.`;\n                    }\n                }, (error) => {\n                    console.error('Erro no listener do catalogo:', error);\n                });\n            }\n"""
          if old_auth not in s:
              raise SystemExit('Bloco de autenticacao nao encontrado.')
          s = s.replace(old_auth, new_auth, 1)

          # Mantem o botao de atualizacao forcada como fallback, mas marca a rotina.
          start = s.index('        window.baixarCatalogoDaNuvem = async function() {')
          end = s.index('        window.atualizarFiltrosDOM = function() {', start)
          old_fn = s[start:end]
          new_fn = old_fn.replace('window.baixarCatalogoDaNuvem = async function()', 'window.baixarCatalogoDaNuvem = async function()', 1)
          if 'getDocs(colRefCatalogo)' not in new_fn:
              raise SystemExit('Rotina de atualizacao forcada nao encontrada.')
          s = s[:start] + marker + new_fn + s[end:]

          p.write_text(s, encoding='utf-8')
          print('Patch V51 aplicado com sucesso.')

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "V51: sincronizacao em tempo real"
          git push origin HEAD:v51-sync-catalogo
