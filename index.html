<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Smart Estoque V51 — DEV</title>
  <style>
    html,body{margin:0;padding:0;width:100%;height:100%;background:#f8fafc;font-family:Arial,sans-serif}
    #status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#475569;font-size:14px;padding:20px;text-align:center}
  </style>
</head>
<body>
  <div id="status">Carregando Smart Estoque V51-DEV…</div>
  <script>
    (async () => {
      const RAW_URL = 'https://raw.githubusercontent.com/kardoso42/SMARTESTOQUE/7d51713b9c6035fbf0d33c19e87c1c32c8db8f41/index.html';
      const status = document.getElementById('status');
      try {
        const response = await fetch(RAW_URL, { cache: 'no-store' });
        if (!response.ok) throw new Error(`Falha ao carregar a base V50.6 (${response.status})`);
        let html = await response.text();

        const oldConfig = /let firebaseConfig\s*=\s*\{[\s\S]*?apiKey:\s*["']AIzaSyCUqfEuvJNSKERsE-Cj1U3ysbJ6GB_4IGg["'][\s\S]*?appId:\s*["']1:969025703082:web:11d3fa2060886071edd4d3["'][\s\S]*?\};/;
        const newConfig = `let firebaseConfig = {
            apiKey: "AIzaSyAGwu-Gntk60VWU6C9nrgZNrRNsuAwmiU4",
            authDomain: "smart-estoque-v51.firebaseapp.com",
            projectId: "smart-estoque-v51",
            storageBucket: "smart-estoque-v51.firebasestorage.app",
            messagingSenderId: "530974032242",
            appId: "1:530974032242:web:eaec6133d1505a0e4d1deb"
        };`;

        if (!oldConfig.test(html)) {
          throw new Error('Configuração Firebase da base V50.6 não localizada.');
        }
        html = html.replace(oldConfig, newConfig);
        html = html.replace(/const appId = typeof __app_id !== 'undefined' \? __app_id : 'auditor-estoque-v32';/, "const appId = 'smart-estoque-v51';");
        html = html.replace(/collection\(db,\s*'artifacts',\s*appId,\s*'public',\s*'data',\s*'catalogo'\)/g, "collection(db, 'catalogo')");
        html = html.replace(/collection\(db,\s*'artifacts',\s*appId,\s*'public',\s*'data',\s*'contagens'\)/g, "collection(db, 'contagens')");
        html = html.replace(/doc\(db,\s*'artifacts',\s*appId,\s*'public',\s*'data',\s*'catalogo',\s*docId\)/g, "doc(db, 'catalogo', docId)");

        const modalUpgrade = `
<style id="v51-options-premium">
:root{
  --v51-modal-bg:#172236;
  --v51-modal-panel:#1d2a40;
  --v51-modal-card:#223149;
  --v51-modal-soft:#0f1a2e;
  --v51-modal-border:rgba(148,163,184,.20);
  --v51-modal-text:#f8fafc;
  --v51-modal-muted:#9fb0c9;
  --v51-modal-blue:#3b82f6;
  --v51-modal-green:#10b981;
  --v51-modal-red:#ef4444;
}

/* Modal de opções — refresh premium sem alterar a lógica existente */
.modal-content{
  width:min(560px,calc(100vw - 24px)) !important;
  max-height:min(88vh,820px) !important;
  overflow:hidden !important;
  padding:0 !important;
  background:linear-gradient(180deg,#18253a 0%,#142033 100%) !important;
  border:1px solid rgba(148,163,184,.22) !important;
  border-radius:18px !important;
  box-shadow:0 28px 80px rgba(0,0,0,.38),0 8px 24px rgba(0,0,0,.20) !important;
}
.modal-content>*{box-sizing:border-box}
.modal-content .modal-header,
.modal-content .m-header,
.modal-content .options-header{
  padding:20px 22px !important;
  background:linear-gradient(180deg,rgba(37,56,83,.98),rgba(29,42,64,.98)) !important;
  border-bottom:1px solid var(--v51-modal-border) !important;
}
.modal-content h2,.modal-content h3,.modal-content h4{
  color:var(--v51-modal-text) !important;
  letter-spacing:-.02em !important;
}
.modal-content h3,.modal-content h4{font-weight:800 !important}
.modal-content .modal-body,
.modal-content .m-body,
.modal-content .options-body{
  padding:20px !important;
  background:transparent !important;
}
.modal-content .m-info-box,
.modal-content .multi-select-box,
.modal-content .switch-container,
.modal-content .option-card,
.modal-content .settings-section,
.modal-content .config-section{
  margin:0 0 14px !important;
  padding:16px !important;
  background:linear-gradient(180deg,rgba(35,51,76,.98),rgba(29,43,64,.98)) !important;
  border:1px solid var(--v51-modal-border) !important;
  border-radius:14px !important;
  box-shadow:0 8px 20px rgba(0,0,0,.12) !important;
}
.modal-content .m-info-box:last-child,
.modal-content .option-card:last-child,
.modal-content .settings-section:last-child,
.modal-content .config-section:last-child{margin-bottom:0 !important}
.modal-content .m-info-box:hover,
.modal-content .option-card:hover,
.modal-content .settings-section:hover,
.modal-content .config-section:hover{
  border-color:rgba(96,165,250,.28) !important;
  transform:translateY(-1px);
  transition:.18s ease;
}
.modal-content label,
.modal-content .section-title,
.modal-content .m-label{
  color:#dce7f5 !important;
  font-weight:700 !important;
}
.modal-content small,
.modal-content .hint,
.modal-content .muted,
.modal-content p{color:var(--v51-modal-muted) !important}
.modal-content .multi-select-box{max-height:210px !important;overflow:auto !important}
.modal-content input[type="text"],
.modal-content input[type="number"],
.modal-content input[type="password"],
.modal-content input[type="date"],
.modal-content select,
.modal-content textarea{
  min-height:46px !important;
  background:#0f1a2e !important;
  color:#f8fafc !important;
  border:1px solid rgba(148,163,184,.24) !important;
  border-radius:11px !important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.02) !important;
}
.modal-content input:focus,.modal-content select:focus,.modal-content textarea:focus{
  border-color:rgba(59,130,246,.85) !important;
  box-shadow:0 0 0 4px rgba(59,130,246,.14) !important;
}
.modal-content button{
  min-height:46px !important;
  border-radius:11px !important;
  font-weight:800 !important;
  box-shadow:0 8px 18px rgba(0,0,0,.14) !important;
}
.modal-content button.btn-blue,
.modal-content .btn-blue{background:linear-gradient(180deg,#4b8df8,#3478ea) !important}
.modal-content button.btn-green,
.modal-content .btn-green{background:linear-gradient(180deg,#16c995,#0eae80) !important}
.modal-content button.btn-red,
.modal-content .btn-red{background:linear-gradient(180deg,#f05252,#dc3434) !important}
.modal-content button.btn-outline,
.modal-content .btn-outline{background:#17243a !important;color:#dbe8f7 !important;border-color:rgba(148,163,184,.22) !important}
.modal-content button:hover:not(:disabled){filter:none !important;transform:translateY(-1px) !important}
.modal-content .switch-container{display:flex;align-items:center;justify-content:space-between;gap:16px}
.modal-content input[type="checkbox"]{accent-color:var(--v51-modal-green)}
.modal-content .modal-footer,
.modal-content .m-footer,
.modal-content .options-footer{
  padding:14px 20px 18px !important;
  background:linear-gradient(180deg,rgba(21,32,50,.96),rgba(18,29,46,.98)) !important;
  border-top:1px solid var(--v51-modal-border) !important;
  position:sticky;
  bottom:0;
  z-index:5;
}
.modal-content .modal-footer button,
.modal-content .m-footer button,
.modal-content .options-footer button{width:100% !important}
.modal-content::-webkit-scrollbar{width:10px}
.modal-content::-webkit-scrollbar-track{background:#0f1a2e;border-radius:10px}
.modal-content::-webkit-scrollbar-thumb{background:#40516b;border-radius:10px;border:2px solid #0f1a2e}
.modal-content::-webkit-scrollbar-thumb:hover{background:#58708f}

/* Separadores visuais para as áreas do modal */
.modal-content .section-title::before,
.modal-content .m-label::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#60a5fa;margin-right:8px;vertical-align:middle;box-shadow:0 0 0 4px rgba(96,165,250,.10)}

@media(max-width:600px){
  .modal-content{width:calc(100vw - 16px) !important;max-height:92vh !important;border-radius:15px !important}
  .modal-content .modal-body,.modal-content .m-body,.modal-content .options-body{padding:14px !important}
  .modal-content .m-info-box,.modal-content .option-card,.modal-content .settings-section,.modal-content .config-section{padding:14px !important;border-radius:12px !important}
  .modal-content button{min-height:44px !important}
}
</style>`;
        html = html.replace('</head>', modalUpgrade + '\\n</head>');

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error(error);
        status.innerHTML = `<strong>Não foi possível carregar a V51-DEV.</strong><br><br>${String(error.message || error)}`;
      }
    })();
  </script>
</body>
</html>
